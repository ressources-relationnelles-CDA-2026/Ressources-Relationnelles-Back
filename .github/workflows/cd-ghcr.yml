name: Back - Publication Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publier l'image Back
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Génération des tags Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ressources-relationnelles-cda-2026/ressources-relationnelles-back
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max