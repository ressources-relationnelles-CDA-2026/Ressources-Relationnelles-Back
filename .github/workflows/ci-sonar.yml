name: Back - SonarCloud

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  sonar:
    name: Tests et analyse SonarCloud
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: projetcollab_test
          MYSQL_USER: ressources
          MYSQL_PASSWORD: ressources
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: >-
        mysql://ressources:ressources@127.0.0.1:3306/projetcollab?serverVersion=8.4&charset=utf8mb4

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_mysql, zip
          coverage: xdebug

      - name: Installation des dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Création du dossier de rapports
        run: mkdir -p reports

      - name: Création du schéma de test
        run: php bin/console doctrine:schema:create --env=test

      - name: Chargement des fixtures
        run: php bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Tests PHPUnit avec couverture
        run: php bin/phpunit --coverage-clover coverage.xml --log-junit reports/phpunit.xml

      - name: Sauvegarde des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-phpunit-reports
          path: |
            coverage.xml
            reports/phpunit.xml
          if-no-files-found: warn

      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}