name: Back - OWASP ZAP

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  zap-scan:
    name: Scan OWASP ZAP
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: projetcollab_test
          MYSQL_USER: ressources
          MYSQL_PASSWORD: ressources

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      APP_DEBUG: "0"
      DATABASE_URL: "mysql://ressources:ressources@127.0.0.1:3306/projetcollab?serverVersion=8.4&charset=utf8mb4"

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_mysql, zip
          coverage: none

      - name: Installation des dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Création du schéma de test
        run: php bin/console doctrine:schema:create --env=test

      - name: Chargement des fixtures
        run: php bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Démarrage de l'API
        run: |
          php -d expose_php=0 -S 0.0.0.0:8000 -t public > /tmp/api.log 2>&1 &
          echo $! > api.pid

      - name: Attente du démarrage
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/docs.jsonopenapi > /dev/null; then
              echo "API disponible"
              exit 0
            fi

            echo "Attente de l'API..."
            sleep 2
          done

          cat /tmp/api.log
          exit 1
      
      - name: Vérification des routes avant ZAP
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            "http://127.0.0.1:8000/api/categories?page=1"

          curl --fail-with-body --silent --show-error \
            "http://127.0.0.1:8000/api/ressources?page=1"

            
      - name: Scan OWASP ZAP
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: "http://127.0.0.1:8000/api/docs.jsonopenapi"
          format: openapi
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true
          cmd_options: "-I"

      - name: Affichage des logs en cas d'échec
        if: failure()
        run: tail -n 200 /tmp/api.log