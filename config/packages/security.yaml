security:
    password_hashers:
        App\Entity\Utilisateurs: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateurs
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login_check
            stateless: true
            provider: app_user_provider
            login_throttling:
                max_attempts: 3
                interval: '5 minutes'
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: App\Security\AuthenticationSuccessHandler
                failure_handler: App\Security\AuthenticationFailureHandler

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api/$, roles: PUBLIC_ACCESS }
        - { path: ^/api/csrf-token, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/register, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/utilisateurs, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/ressources, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/ressources, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/tags, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/categories, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/types, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
